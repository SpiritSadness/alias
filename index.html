<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101629">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('alias-theme')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'};document.querySelector('meta[name=theme-color]').content=document.documentElement.dataset.theme==='light'?'#f4f6ee':'#101629'</script>
  <meta name="description" content="Alias — игра для друзей с классическими и своими правилами, которая работает без интернета.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alias">
  <link rel="apple-touch-icon" href="./apple-touch-icon-v18.png">
  <link rel="manifest" href="./manifest.webmanifest?v=18">
  <link rel="icon" href="./icon.svg?v=18" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20">
  <title>Alias — игра для друзей</title>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div id="app" class="app-shell"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=20"></script>
</body>
</html>
